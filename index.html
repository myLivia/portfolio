:root{
  --black:#000;
  --bone:#E8E0D4;
  --ash:#9A9184;
  --garnet:#B32A43;
  --line:rgba(232,224,212,.14);
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Manrope",system-ui,sans-serif;
  --pad:clamp(20px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--black)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--black);color:var(--bone);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{color:var(--garnet)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--garnet);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad)}
.serif{font-family:var(--serif)}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}

/* верхняя панель */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:16px var(--pad);font-size:14px;transition:background .3s}
.bar.solid{background:rgba(0,0,0,.86);backdrop-filter:blur(8px)}
.bar .mark{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.01em;text-decoration:none;margin-right:auto;opacity:0;transition:opacity .3s}
.bar.solid .mark{opacity:1}
.bar nav{display:flex;gap:clamp(14px,2.4vw,30px)}
.bar nav a{text-decoration:none;color:var(--ash);letter-spacing:.04em}
.bar nav a:hover{color:var(--bone)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{padding:3px 10px;border-radius:999px;font-size:12px;letter-spacing:.06em;color:var(--ash)}
.lang button[aria-pressed="true"]{background:var(--bone);color:var(--black)}
@media (max-width:640px){.bar nav{display:none}}

/* главный экран: гранат, которым управляет прокрутка */
.hero{position:relative;height:320vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000 url(assets/hero/000.jpg) center/cover no-repeat}
#seq{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);pointer-events:none}
.hero-copy{position:absolute;z-index:1;left:var(--pad);right:var(--pad);bottom:clamp(32px,7vh,72px);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;will-change:opacity}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(72px,13vw,210px);line-height:.86;letter-spacing:-.015em}
.hero h1 em{font-style:italic;font-weight:400;color:var(--garnet)}
.tagline{font-size:clamp(17px,1.5vw,20px);margin-top:20px;max-width:34ch}
.tagline-sub{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);margin-top:10px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.hint{font-size:13px;color:var(--ash);text-align:right}
.cta{display:inline-block;padding:12px 26px;border:1px solid var(--bone);border-radius:999px;text-decoration:none;font-size:14px;letter-spacing:.04em;color:var(--bone);background:rgba(0,0,0,.35)}
.cta:hover{background:var(--bone);color:var(--black)}
.outro{position:absolute;z-index:1;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-50%);opacity:0;pointer-events:none}
.outro p{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.4vw,64px);line-height:1.1;max-width:24ch}
@media (max-width:640px){.hero-copy{flex-direction:column;align-items:flex-start}.side{align-items:flex-start}.hint{text-align:left}}

/* цифры и принципы */
.facts{padding-top:clamp(56px,7vw,96px)}
.facts-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,64px);align-items:start}
.fact{border-top:1px solid var(--line);padding-top:22px}
.fact b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(48px,5.6vw,84px);line-height:1}
.fact span{display:block;color:var(--ash);font-size:15px;margin-top:12px;max-width:28ch}
.howwe{margin-top:clamp(56px,7vw,96px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,72px);align-items:start}
.howwe h3{font-family:var(--serif);font-weight:500;font-size:clamp(36px,3.8vw,56px);line-height:1}
.howwe ol{list-style:none;counter-reset:n;display:grid;gap:0}
.howwe li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;gap:0;padding:18px 0;border-top:1px solid var(--line);font-size:clamp(16px,1.35vw,19px);line-height:1.6}
.howwe li:last-child{border-bottom:1px solid var(--line)}
.howwe li::before{content:"0" counter(n);font-family:var(--serif);font-size:20px;color:var(--garnet);line-height:1.45}
@media (max-width:760px){.facts-row,.howwe{grid-template-columns:1fr}}

/* секции */
section{padding:clamp(80px,11vw,150px) 0}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(56px,8vw,120px);line-height:.95;letter-spacing:-.01em;margin-bottom:clamp(36px,5vw,72px)}
.lead{font-size:clamp(16px,1.35vw,19px);color:var(--ash);max-width:56ch;margin:-12px 0 clamp(32px,4vw,56px)}

/* проекты */
.project{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,72px);padding:clamp(56px,7vw,100px) 0;border-top:1px solid var(--line);align-items:start}
.project:first-child{border-top:0;padding-top:0}
.credits{position:sticky;top:96px}
.ptitle{font-family:var(--serif);font-weight:500;font-size:clamp(40px,4.6vw,68px);line-height:1;margin-bottom:14px}
.meta{color:var(--ash);font-size:14px;letter-spacing:.02em}
.award{margin-top:28px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center;font-size:14px;line-height:1.5}
.laurel{display:flex;align-items:center;gap:4px;color:var(--bone)}
.laurel svg{width:24px;height:44px}
.laurel svg:last-child{transform:scaleX(-1)}
.laurel strong{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1}
.award p{color:var(--ash);max-width:34ch}
.stat{font-family:var(--serif);font-weight:500;font-size:clamp(28px,2.4vw,34px);line-height:1.1;margin-top:28px}
.stat span{display:block;font-family:var(--sans);font-size:14px;color:var(--ash);margin-top:8px;line-height:1.55;max-width:44ch}
.ptext{margin-top:24px;max-width:50ch}
.pfacts{margin-top:18px;font-size:14px;color:var(--ash);max-width:50ch}
dl{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;max-width:50ch}
dt{color:var(--ash)}
.links{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(30px,2.8vw,42px);line-height:1.1;margin-top:26px}
.quote + .meta{margin-top:6px}

.media{display:flex;flex-direction:column;gap:12px}
.frame{position:relative;overflow:hidden;background:#0c0a09;border-radius:2px;aspect-ratio:16/9}
.frame.portrait{aspect-ratio:4/5;max-width:560px}
.frame img,.frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
.frame img.fit{object-fit:contain}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.play::after{content:"";width:0;height:0;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent var(--bone);filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.play:hover{background:rgba(0,0,0,.1)}
.reel-note{font-size:13px;color:var(--ash);margin-top:6px}
.reel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.reel button{text-align:left;opacity:.55;transition:opacity .2s;display:flex;flex-direction:column}
.reel button:hover,.reel button[aria-pressed="true"]{opacity:1}
.reel .pic{display:block;position:relative;aspect-ratio:16/9;border-radius:2px;overflow:hidden;background:#0c0a09}
.reel .pic img{width:100%;height:100%;object-fit:cover;display:block}
.reel .pic::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-35%,-50%);border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent var(--bone);filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.reel button[aria-pressed="true"] .pic{box-shadow:0 0 0 1px var(--bone)}
.reel .lbl{display:block;font-size:13px;line-height:1.35;margin-top:8px}
.reel small{display:block;font-size:12px;color:var(--ash)}
@media (max-width:520px){.reel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs button{width:88px;aspect-ratio:16/9;border-radius:2px;overflow:hidden;opacity:.5;outline-offset:2px}
.thumbs.portrait button{width:64px;aspect-ratio:4/5}
.thumbs button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 1px var(--bone)}
.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:13px;color:var(--ash)}

/* широкий проект с галереей */
.project.wide{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.project.wide .credits{position:static}
.project.wide .media{grid-column:1 / -1}
.gallery{display:flex;flex-direction:column;gap:10px}
.grow{display:flex;gap:28px}
.ggrp{display:flex;flex-direction:column;gap:10px;min-width:0}
.gitems{display:flex;gap:10px}
.gi{display:block;position:relative;overflow:hidden;border-radius:2px;background:#0c0a09;cursor:zoom-in;padding:0}
.gi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,opacity .3s;opacity:.92}
.gi:hover img{transform:scale(1.03);opacity:1}
.glabel{margin-top:18px}
.grow:first-child .glabel{margin-top:0}
@media (max-width:760px){
  .grow{flex-direction:column;gap:10px}
  .gitems{display:grid;grid-template-columns:1fr 1fr}
  .gi{aspect-ratio:3/4 !important}
  .gi.wide{grid-column:1 / -1;aspect-ratio:auto !important}
}

/* лента кадров после цифр */
.band{margin-top:clamp(64px,8vw,112px)}
.band-head{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.band-head p:last-child{color:var(--ash);font-size:14px;max-width:52ch}
.band-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(8px,1vw,12px)}
.band-grid .gi{aspect-ratio:16/9}
@media (max-width:760px){.band-grid .gi{grid-column:1 / -1 !important;aspect-ratio:16/9 !important}}

/* лайтбокс */
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:56px var(--pad) 28px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;display:block}
.lb p{font-size:14px;color:var(--ash)}
.lb .x{position:absolute;top:14px;right:var(--pad);font-size:30px;line-height:1;color:var(--bone)}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--serif);font-size:48px;color:var(--bone);opacity:.6;padding:12px}
.lb .nv:hover{opacity:1}
.lb .pv{left:8px}.lb .nx{right:8px}

/* кадры */
.clips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.4vw,18px)}
.clip{position:relative;overflow:hidden;background:#0c0a09;border-radius:2px}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip figcaption{position:absolute;left:14px;bottom:12px;font-size:13px;color:var(--bone);text-shadow:0 1px 6px rgba(0,0,0,.8)}
@media (max-width:760px){.clip{grid-column:1 / -1 !important;aspect-ratio:16/9 !important}}

/* о нас */
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,80px)}
.person{border-top:1px solid var(--line);padding-top:26px}
.person h3{font-family:var(--serif);font-weight:500;font-size:clamp(36px,3.4vw,52px);line-height:1}
.person .nick{color:var(--ash);font-size:14px;margin:8px 0 18px}
.person p{max-width:46ch}
.together{margin-top:clamp(48px,6vw,88px);font-family:var(--serif);font-style:italic;font-size:clamp(28px,2.8vw,40px);line-height:1.15;max-width:32ch}
.tools{margin-top:22px;color:var(--ash);font-size:14px;max-width:72ch}
@media (max-width:760px){.people{grid-template-columns:1fr}.project,.project.wide{grid-template-columns:1fr}.credits{position:static}.media{order:-1}.project.wide .media{order:0}}

/* контакты */
.contact a.big{display:block;width:fit-content;font-family:var(--serif);font-weight:500;font-size:clamp(36px,5.6vw,80px);line-height:1.12;text-decoration:none}
.contact a.big:hover{color:var(--garnet)}

function filmBlock(p, pid){
  const films = p.films, f = films[0];
  const reel = films.length > 1 ? `<p class="reel-note">${esc(t(p.filmsNote) || T[L].film)}</p><div class="reel" role="group" aria-label="${esc(T[L].film)}">${films.map((x,i)=>

  return `<div class="frame" id="film-${pid}">${poster(f)}</div>${reel}`;
}
function poster(f){
  return `<img src="https://i.ytimg.com/vi/${f.yt}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><button class="play" type="button" data-yt="${f.yt}" aria-label="${esc(T[L].play)}: ${esc(t(f.label))}"></button>`;
}
function stillsBlock(list, pid, portrait, fit){
  const [k, alt] = list[0];
  const own = list.length === 1 && RATIO[k] ? ` style="aspect-ratio:${RATIO[k]}"` : "";
  const main = `<div class="frame${portrait ? " portrait" : ""}" id="still-${pid}"${own}><img class="${fit ? "fit" : ""}" src="${IMG(k)}" alt="${esc(t(alt))}" loading="lazy" decoding="async"></div>`;
  if (list.length < 2) return main;
  const th = list.map(([kk, a], i) => `<button type="button" data-still="${pid}:${i}" aria-pressed="${i===0}" aria-label="${esc(T[L].shot)} ${i+1}: ${esc(t(a))}"><img src="${SM(kk)}" alt="" loading="lazy" decoding="async"></button>`).join("");
  return main + `<div class="thumbs${portrait ? " portrait" : ""}">${th}</div>`;
}
let LB = [];
function galleryBlock(rows){
  return `<div class="gallery">${rows.map(row => {
    const groups = row.map(g => {
      const sum = g.items.reduce((s,[k]) => s + RATIO[k], 0);
      const items = g.items.map(([k, alt]) => {
        const r = RATIO[k], i = LB.push([k, alt]) - 1;
        return `<button type="button" class="gi${r > 1.9 ? " wide" : ""}" data-lbi="${i}" style="flex:${r} 1 0;aspect-ratio:${r}" aria-label="${esc(t(alt))}"><img src="${SM(k)}" alt="${esc(t(alt))}" loading="lazy" decoding="async"></button>`;
      }).join("");
      return `<div class="ggrp" style="flex:${sum} 1 0">${g.label ? `<p class="kicker glabel">${esc(t(g.label))}</p>` : ""}<div class="gitems">${items}</div></div>`;
    }).join("");
    return `<div class="grow">${groups}</div>`;
  }).join("")}</div>`;
}
function creditsBlock(p){

  if (p.quote) h += `<p class="quote">${esc(t(p.quote))}</p><p class="meta">${esc(t(p.quoteBy))}</p>`;
  if (p.stat) h += `<p class="stat">${esc(t(p.stat))}${p.statNote ? `<span>${esc(t(p.statNote))}</span>` : ""}</p>`;
  if (p.text) h += `<p class="ptext">${esc(t(p.text))}</p>`;
  if (p.facts) h += `<p class="pfacts">${esc(t(p.facts))}</p>`;
  if (p.credits) h += `<dl>${p.credits.map(([k,v]) => `<dt>${esc(T[L][k])}</dt><dd>${esc(t(v))}</dd>`).join("")}</dl>`;
  if (p.links) h += `<p class="links">${p.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(t(l.label))}</a>`).join("")}</p>`;
  return h;
}
function projectHTML(p, pid){
  let m = "";

  if (p.video) m += `<div class="frame"><video src="${VID(p.video)}" poster="${POS(p.video)}" controls playsinline preload="none"></video></div>`;
  if (p.stills) m += stillsBlock(p.stills, pid, p.portrait, p.stillsFit);
  if (p.gallery) m += galleryBlock(p.gallery);
  if (p.stillsNote) m += `<p class="cap">${esc(T[L][p.stillsNote])}</p>`;
  return `<article class="project${p.wide ? " wide" : ""}"><div class="credits">${creditsBlock(p)}</div><div class="media">${m}</div></article>`;
}

function render(){

  $("smallLinks").innerHTML = `<a href="https://t.me/mylivia_aimiry" target="_blank" rel="noopener">${esc(T[L].channel)}</a><a href="https://www.instagram.com/mylivia_ai" target="_blank" rel="noopener">Instagram Livia</a><a href="https://www.instagram.com/mihaang_ai" target="_blank" rel="noopener">Instagram Miha</a>`;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  document.querySelector("#lb .x").setAttribute("aria-label", T[L].close);

/* лайтбокс для галереи */
let lbI = 0;
function lbShow(i){
  lbI = (i + LB.length) % LB.length;
  const [k, alt] = LB[lbI];
  $("lbImg").src = IMG(k); $("lbImg").alt = t(alt); $("lbCap").textContent = t(alt);
  $("lb").classList.add("on"); $("lb").setAttribute("aria-hidden", "false");
}
function lbClose(){ $("lb").classList.remove("on"); $("lb").setAttribute("aria-hidden", "true"); }
addEventListener("keydown", e => {
  if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") lbClose();
  if (e.key === "ArrowRight") lbShow(lbI + 1);
  if (e.key === "ArrowLeft") lbShow(lbI - 1);
});

/* клики: смена языка, включение роликов, переключение кадров */
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lb]");
  if (lb){ const a = lb.dataset.lb; a === "close" ? lbClose() : lbShow(lbI + (a === "next" ? 1 : -1)); return; }
  if (e.target.id === "lb"){ lbClose(); return; }
  const gi = e.target.closest("[data-lbi]");
  if (gi){ lbShow(+gi.dataset.lbi); return; }
  const lang = e.target.closest("[data-lang]");
  if (lang){ L = lang.dataset.lang; render(); return; }
  const pl = e.target.closest("[data-yt]");
  if (pl){
    const fr = pl.parentElement;
    fr.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${pl.dataset.yt}?autoplay=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    return;
  }
  const fb = e.target.closest("[data-film]");
  if (fb){
    const [pid, i] = fb.dataset.film.split(":");
    const p = PROJECTS[+pid.slice(1)];
    $("film-" + pid).innerHTML = poster(p.films[+i]);
    fb.closest(".reel").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === fb));
    return;
  }
  const sb = e.target.closest("[data-still]");
  if (sb){
    const [pid, i] = sb.dataset.still.split(":");
    const p = (pid[0] === "p" ? PROJECTS : PERSONAL)[+pid.slice(1)];
    const [k, alt] = p.stills[+i];
    const img = $("still-" + pid).querySelector("img");
    img.src = IMG(k); img.alt = t(alt);
    sb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sb));
  }
});

let io;
function watchClips(){
  if (reduce || !("IntersectionObserver" in window)) return;
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => {
    const v = en.target;
    if (en.isIntersecting){ if (v.preload === "none") v.preload = "auto"; v.play().catch(()=>{}); } else v.pause();
  }), { threshold: .35 });
  document.querySelectorAll("video[data-auto]").forEach(v => io.observe(v));
}

/* ---- гранат: прокрутка управляет временем ----
   Первый кадр грузится сразу, остальные следом, по порядку. */
const cv = $("seq"), ctx = cv.getContext("2d");
const imgs = FRAMES.map(() => null);
const hero = $("hero"), copy = $("heroCopy"), outro = $("outro"), bar = $("bar");
let last = -1, ticking = false;

function loadFrame(i){
  return new Promise(res => { const im = new Image(); im.decoding = "async"; im.onload = () => { imgs[i] = im; res(); }; im.onerror = res; im.src = FRAMES[i]; });
}
async function loadAll(){
  await loadFrame(0); last = -1; draw();
  for (let i = 1; i < FRAMES.length; i += 6){
    await Promise.all(Array.from({ length: Math.min(6, FRAMES.length - i) }, (_, j) => loadFrame(i + j)));
    last = -1; draw();
  }
}
function size(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  last = -1; draw();
}
function drawFrame(i){
  let j = i; while (j > 0 && !imgs[j]) j--;      // если кадр ещё не загрузился, берём ближайший готовый
  const im = imgs[j]; if (!im) return;
  const W = cv.width, H = cv.height, s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
}
function progress(){
  const r = hero.getBoundingClientRect(), span = hero.offsetHeight - innerHeight;
  return Math.min(1, Math.max(0, -r.top / span));
}
function draw(){
  ticking = false;
  const p = reduce ? .28 : progress();
  const fp = Math.min(1, p / .8);                       // взрыв занимает 80% прокрутки, дальше темнота
  const i = Math.round(fp * (FRAMES.length - 1));
  if (i !== last){ drawFrame(i); last = i; }
  if (!reduce){
    copy.style.opacity = Math.max(0, 1 - p * 3);
    outro.style.opacity = Math.min(1, Math.max(0, (p - .78) / .12));
  }
  bar.classList.toggle("solid", hero.getBoundingClientRect().bottom < 80);
}
addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(draw); } }, { passive: true });
addEventListener("resize", size);
if (reduce){ hero.style.height = "100vh"; outro.style.display = "none"; }

render();
size();
loadAll();
</script>
