<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livia & Miha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --black:#000;
  --bone:#E8E0D4;
  --ash:#958C80;
  --garnet:#B32A43;
  --line:rgba(232,224,212,.14);
  --panel:#16110F;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root{--black:#000;--bone:#E8E0D4;--ash:#958C80;--garnet:#B32A43;--line:rgba(232,224,212,.14);--panel:#16110F;color-scheme:dark}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--black)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--black);color:var(--bone);font:400 17px/1.6 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:4px;text-decoration-thickness:1px}
a:hover{color:var(--garnet)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--garnet);outline-offset:3px}
.cond{font-family:"Fira Sans Extra Condensed",system-ui,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}

/* верхняя панель */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:clamp(14px,3vw,36px);padding:18px clamp(18px,4vw,56px);font-size:15px;transition:background .3s}
.bar.solid{background:rgba(0,0,0,.86);backdrop-filter:blur(8px)}
.bar .mark{font-family:"Fira Sans Extra Condensed";font-weight:600;font-size:20px;text-decoration:none;margin-right:auto;opacity:0;transition:opacity .3s}
.bar.solid .mark{opacity:1}
.bar nav{display:flex;gap:clamp(12px,2.4vw,28px)}
.bar nav a{text-decoration:none;color:var(--ash)}
.bar nav a:hover{color:var(--bone)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{padding:4px 10px;border-radius:999px;font-size:13px;color:var(--ash)}
.lang button[aria-pressed="true"]{background:var(--bone);color:var(--black)}
@media (max-width:640px){.bar nav{display:none}}

/* главный экран: гранат, которым управляет прокрутка */
.hero{position:relative;height:320vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#seq{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-copy{position:absolute;left:clamp(18px,4vw,56px);right:clamp(18px,4vw,56px);bottom:clamp(28px,6vh,64px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;will-change:opacity}
.hero h1{font-family:"Fira Sans Extra Condensed";font-weight:500;font-size:clamp(76px,15vw,230px);line-height:.84;letter-spacing:-.01em}
.tagline{font-size:clamp(17px,1.6vw,21px);margin-top:16px;max-width:30ch}
.hint{font-size:14px;color:var(--ash);max-width:24ch;text-align:right}
.outro{position:absolute;left:clamp(18px,4vw,56px);right:clamp(18px,4vw,56px);top:50%;transform:translateY(-50%);opacity:0;pointer-events:none}
.outro p{font-family:"Fira Sans Extra Condensed";font-size:clamp(30px,4.4vw,64px);line-height:1.08;max-width:22ch}
@media (max-width:640px){.hero-copy{flex-direction:column;align-items:flex-start}.hint{text-align:left}}

/* секции */
section{padding:clamp(72px,11vw,150px) 0}
h2{font-family:"Fira Sans Extra Condensed";font-weight:500;font-size:clamp(48px,8vw,120px);line-height:.9;margin-bottom:clamp(28px,4vw,56px)}
.lead{font-size:clamp(17px,1.5vw,20px);color:var(--ash);max-width:52ch;margin:-12px 0 clamp(32px,4vw,56px)}

/* кадры */
.clips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(10px,1.4vw,18px)}
.clip{position:relative;overflow:hidden;background:#0c0a09;border-radius:2px}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip figcaption{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--bone);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.c1{grid-column:span 4;aspect-ratio:1/1}
.c2{grid-column:span 8;aspect-ratio:16/9;align-self:end}
.c3{grid-column:span 7;aspect-ratio:16/9}
.c4{grid-column:span 5;aspect-ratio:16/9;align-self:start;margin-top:clamp(0px,6vw,90px)}
.c5{grid-column:3 / span 6;aspect-ratio:16/9}
@media (max-width:760px){.c1,.c2,.c3,.c4,.c5{grid-column:1 / -1;margin-top:0}.c1{aspect-ratio:1/1}}

/* проекты */
.project{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,72px);padding:clamp(56px,7vw,100px) 0;border-top:1px solid var(--line)}
.project:first-child{border-top:0;padding-top:0}
.credits{position:sticky;top:90px;align-self:start}
.ptitle{font-family:"Fira Sans Extra Condensed";font-weight:500;font-size:clamp(40px,5.2vw,76px);line-height:.95;margin-bottom:14px}
.meta{color:var(--ash);font-size:15px}
.award{margin-top:22px;padding:14px 16px;border:1px solid var(--garnet);border-radius:2px;font-size:15px;line-height:1.45}
.award strong{display:block;font-family:"Fira Sans Extra Condensed";font-weight:600;font-size:24px;color:var(--garnet);line-height:1.1;margin-bottom:2px}
.stat{font-family:"Fira Sans Extra Condensed";font-size:clamp(28px,2.6vw,36px);line-height:1.1;margin-top:22px}
.stat span{display:block;font-family:"Golos Text";font-size:15px;color:var(--ash);margin-top:6px;line-height:1.5;max-width:42ch}
.ptext{margin-top:22px;max-width:48ch}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin-top:22px;font-size:15px}
dt{color:var(--ash)}
.links{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15px}
.quote{font-family:"Fira Sans Extra Condensed";font-size:clamp(30px,3vw,44px);line-height:1.05;margin-top:22px}
.quote + .meta{margin-top:6px}

.media{display:flex;flex-direction:column;gap:12px}
.frame{position:relative;overflow:hidden;background:#0c0a09;border-radius:2px;aspect-ratio:16/9}
.frame.portrait{aspect-ratio:4/5;max-width:560px}
.frame img,.frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
.frame img.fit{object-fit:contain}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.play::after{content:"";width:0;height:0;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent var(--bone);filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.play:hover{background:rgba(0,0,0,.1)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ash)}
.tabs button small{font-size:12px;opacity:.75;margin-left:6px}
.tabs button[aria-pressed="true"]{border-color:var(--bone);color:var(--bone)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs button{width:88px;aspect-ratio:16/9;border-radius:2px;overflow:hidden;opacity:.5;outline-offset:2px;position:relative}
.thumbs.portrait button{width:60px;aspect-ratio:4/5}
.thumbs button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 1px var(--bone)}
.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-size:13px;color:var(--ash)}

/* о нас */
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,80px)}
.person h3{font-family:"Fira Sans Extra Condensed";font-weight:500;font-size:clamp(34px,3.6vw,52px);line-height:1}
.person .nick{color:var(--ash);font-size:15px;margin:6px 0 16px}
.person p{max-width:44ch}
.together{margin-top:clamp(40px,5vw,72px);font-family:"Fira Sans Extra Condensed";font-size:clamp(26px,3vw,40px);line-height:1.1;max-width:30ch}
.tools{margin-top:20px;color:var(--ash);font-size:15px;max-width:70ch}
@media (max-width:760px){.people{grid-template-columns:1fr}.project{grid-template-columns:1fr}.credits{position:static}.media{order:-1}}

/* контакты */
.contact a.big{display:block;width:fit-content;font-family:"Fira Sans Extra Condensed";font-weight:500;font-size:clamp(34px,6vw,84px);line-height:1.08;text-decoration:none}
.contact a.big:hover{color:var(--garnet)}
.contact .small{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;font-size:16px}
footer{padding:32px 0 44px;color:var(--ash);font-size:14px;border-top:1px solid var(--line)}
</style>
</head>

/* ====================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let L = "ru";
const t = o => (o && typeof o === "object" && !Array.isArray(o)) ? o[L] : o;

function filmBlock(films, pid){
  const f = films[0];
  const tabs = films.length > 1 ? `<div class="tabs" role="group" aria-label="${esc(T[L].film)}">${films.map((x,i)=>
    `<button type="button" data-film="${pid}:${i}" aria-pressed="${i===0}">${esc(t(x.label))}${x.views ? `<small>${esc(t(x.views))}</small>` : ""}</button>`).join("")}</div>` : "";
  return `<div class="frame" id="film-${pid}">${poster(f)}</div>${tabs}`;
}
function poster(f){
  return `<img src="https://i.ytimg.com/vi/${f.yt}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><button class="play" type="button" data-yt="${f.yt}" aria-label="${esc(T[L].play)}: ${esc(t(f.label))}"></button>`;
}
function stillsBlock(list, pid, portrait, fit){
  const [k, alt] = list[0];
  const main = `<div class="frame${portrait ? " portrait" : ""}" id="still-${pid}"><img class="${fit ? "fit" : ""}" src="${A[k]}" alt="${esc(t(alt))}" loading="lazy"></div>`;
  if (list.length < 2) return main;
  const th = list.map(([kk, a], i) => `<button type="button" data-still="${pid}:${i}" aria-pressed="${i===0}" aria-label="${esc(T[L].shot)} ${i+1}: ${esc(t(a))}"><img src="${A[kk]}" alt=""></button>`).join("");
  return main + `<div class="thumbs${portrait ? " portrait" : ""}">${th}</div>`;
}
function creditsBlock(p){
  let h = `<h3 class="ptitle">${esc(t(p.title))}</h3><p class="meta">${esc(t(p.meta))}</p>`;
  if (p.award){ const [a,b] = p.award[L]; h += `<div class="award"><strong>${esc(a)}</strong>${esc(b)}</div>`; }
  if (p.quote) h += `<p class="quote">${esc(t(p.quote))}</p><p class="meta">${esc(t(p.quoteBy))}</p>`;
  if (p.stat) h += `<p class="stat">${esc(t(p.stat))}${p.statNote ? `<span>${esc(t(p.statNote))}</span>` : ""}</p>`;
  if (p.text) h += `<p class="ptext">${esc(t(p.text))}</p>`;
  if (p.credits) h += `<dl>${p.credits.map(([k,v]) => `<dt>${esc(T[L][k])}</dt><dd>${esc(t(v))}</dd>`).join("")}</dl>`;
  if (p.links) h += `<p class="links">${p.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(t(l.label))}</a>`).join("")}</p>`;
  return h;
}
function projectHTML(p, pid){
  let m = "";
  if (p.films) m += filmBlock(p.films, pid);
  if (p.video) m += `<div class="frame"><video src="${A[p.video]}" poster="${A[p.video + "_p"]}" controls playsinline preload="none"></video></div>`;
  if (p.stills) m += stillsBlock(p.stills, pid, p.portrait, p.stillsFit);
  return `<article class="project"><div class="credits">${creditsBlock(p)}</div><div class="media">${m}</div></article>`;
}

function render(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[L][el.dataset.t]);
  $("nav").innerHTML = T[L].nav.map(([h,s]) => `<a href="${h}">${s}</a>`).join("");
  $("projects").innerHTML = PROJECTS.map((p,i) => projectHTML(p, "p" + i)).join("");
  $("personalList").innerHTML = PERSONAL.map((p,i) => projectHTML(p, "x" + i)).join("");
  $("clips").innerHTML = CLIPS.map(c => `<figure class="clip ${c.cls}"><video src="${A[c.v]}" poster="${A[c.v + "_p"]}" muted loop playsinline preload="metadata" ${reduce ? "controls" : "data-auto"}></video><figcaption>${esc(t(c.cap))}</figcaption></figure>`).join("");
  $("people").innerHTML = PEOPLE.map(p => `<div class="person"><h3>${esc(t(p.name))}</h3><p class="nick">${p.nick}, <a href="${p.ig}" target="_blank" rel="noopener">Instagram</a></p><p>${esc(t(p.text))}</p></div>`).join("");
  $("smallLinks").innerHTML = `<a href="https://t.me/mylivia_aimiry" target="_blank" rel="noopener">${esc(T[L].channel)}</a><a href="https://www.instagram.com/mylivia_ai" target="_blank" rel="noopener">Instagram Livia</a><a href="https://www.instagram.com/mihaang_ai" target="_blank" rel="noopener">Instagram Miha</a>`;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  watchClips();
}

/* клики: смена языка, включение роликов, переключение кадров */
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]");
  if (lb){ L = lb.dataset.lang; render(); return; }
  const pl = e.target.closest("[data-yt]");
  if (pl){
    const fr = pl.parentElement;
    fr.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${pl.dataset.yt}?autoplay=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    return;
  }
  const fb = e.target.closest("[data-film]");
  if (fb){
    const [pid, i] = fb.dataset.film.split(":");
    const p = PROJECTS[+pid.slice(1)];
    $("film-" + pid).innerHTML = poster(p.films[+i]);
    fb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === fb));
    return;
  }
  const sb = e.target.closest("[data-still]");
  if (sb){
    const [pid, i] = sb.dataset.still.split(":");
    const p = (pid[0] === "p" ? PROJECTS : PERSONAL)[+pid.slice(1)];
    const [k, alt] = p.stills[+i];
    const img = $("still-" + pid).querySelector("img");
    img.src = A[k]; img.alt = t(alt);
    sb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sb));
  }
});

let io;
function watchClips(){
  if (reduce || !("IntersectionObserver" in window)) return;
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => en.isIntersecting ? en.target.play().catch(()=>{}) : en.target.pause()), { threshold: .35 });
  document.querySelectorAll("video[data-auto]").forEach(v => io.observe(v));
}

/* ---- гранат: прокрутка управляет временем ---- */
const cv = $("seq"), ctx = cv.getContext("2d");
const imgs = FRAMES.map(src => { const im = new Image(); im.src = src; return im; });
const hero = $("hero"), copy = $("heroCopy"), outro = $("outro"), bar = $("bar");
let last = -1, ticking = false;

function size(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  last = -1; draw();
}
function drawFrame(i){
  const im = imgs[i];
  if (!im.complete || !im.naturalWidth) { im.onload = () => { last = -1; draw(); }; return; }
  const W = cv.width, H = cv.height, s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
}
function progress(){
  const r = hero.getBoundingClientRect(), span = hero.offsetHeight - innerHeight;
  return Math.min(1, Math.max(0, -r.top / span));
}
function draw(){
  ticking = false;
  const p = reduce ? .28 : progress();
  const fp = Math.min(1, p / .8);                       // взрыв занимает 80% прокрутки, дальше темнота
  const i = Math.round(fp * (imgs.length - 1));
  if (i !== last){ drawFrame(i); last = i; }
  if (!reduce){
    copy.style.opacity = Math.max(0, 1 - p * 3);
    outro.style.opacity = Math.min(1, Math.max(0, (p - .78) / .12));
  }
  bar.classList.toggle("solid", hero.getBoundingClientRect().bottom < 80);
}
addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(draw); } }, { passive: true });
addEventListener("resize", size);
if (reduce){ hero.style.height = "100vh"; outro.style.display = "none"; }

render();
size();
</script>
